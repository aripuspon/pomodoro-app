<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <header>
      <h1>Pomodoro</h1>
      <div class="header-controls">
        <button id="theme-toggle" class="badge-btn" title="Toggle Dark/Light Theme">Dark Mode</button>
      </div>
    </header>

    <main>
      <div class="intensity-modes">
        <button class="mode-btn active" data-intensity="1" title="Standard: 25m Work / 5m Break">Standard (25m)</button>
        <button class="mode-btn" data-intensity="2" title="Double: 50m Work / 10m Break">Double (50m)</button>
        <button class="mode-btn" data-intensity="3" title="Triple: 75m Work / 15m Break">Triple (75m)</button>
      </div>

      <section class="timer-card">
        <h2 id="timer-phase">Work Phase (Session 1)</h2>
        <div class="time-display" id="time-display">25:00</div>
        
        <div class="timer-controls">
          <button id="btn-start" class="control-btn primary" title="Start Timer">Start</button>
          <button id="btn-pause" class="control-btn warning" title="Pause Timer" disabled>Pause</button>
          <button id="btn-skip" class="control-btn secondary" title="Skip to next phase">Skip</button>
          <button id="btn-reset" class="control-btn danger" title="Reset current phase">Reset</button>
        </div>
      </section>

      <section class="task-section">
        <div class="task-header-main">
          <h3>Tasks</h3>
          <div class="dropdown-wrapper">
            <button id="btn-task-options" class="task-opt-btn" title="Task Options">⋮</button>
            <ul id="task-dropdown-menu" class="task-dropdown-menu hidden">
              <li id="menu-clear-finished">🗑️ Clear Finished Tasks</li>
              <li id="menu-clear-act">🔄 Clear Act Pomodoros</li>
              <li id="menu-uncheck-all">✔️ Uncheck All Tasks</li>
              <li id="menu-delete-all">🗑️ Delete All Tasks</li>
              <li id="menu-reset-all">⚠️ Reset All (Total)</li>
            </ul>
          </div>
        </div>
        <hr class="task-divider">

        <ul id="task-list" class="task-list">
          </ul>

        <button id="btn-show-add-task" class="dashed-btn">
          <span class="plus-icon">⊕</span> Add Task
        </button>

        <div id="add-task-container" class="add-task-container hidden">
          <input type="text" id="task-title" placeholder="What are you working on?" autocomplete="off" required>
          
          <div class="task-form-details">
            <div class="est-pomo-wrapper">
              <label>Est Pomodoros</label>
              <input type="number" id="task-est" min="1" step="1" placeholder="1" title="Optional">
            </div>
            
            <div class="extra-fields-toggles">
              <button type="button" id="btn-add-note" class="link-btn">+ Add Note</button>
              <button type="button" id="btn-add-project" class="link-btn">+ Add Project</button>
            </div>

            <textarea id="task-note" class="hidden task-extra-input" placeholder="Some notes..."></textarea>
            <input type="text" id="task-project" class="hidden task-extra-input" placeholder="Project name (e.g. Work)"></textarea>
          </div>

          <div class="task-form-actions">
            <button type="button" id="btn-cancel-task" class="text-btn">Cancel</button>
            <button type="button" id="btn-save-task" class="solid-btn">Save</button>
          </div>
        </div>

        <div class="task-summary-footer">
          <span id="summary-pomos">Pomos: <strong>0 / 0</strong></span>
          <span id="summary-finish">Finish At: <strong>--:--</strong> (0h)</span>
        </div>
      </section>

      <section class="stats-card">
        <h3>Today's Statistics</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-value" id="stat-sessions">0</span>
            <span class="stat-label">Sessions Done</span>
          </div>
          <div class="stat-box">
            <span class="stat-value" id="stat-minutes">0</span>
            <span class="stat-label">Focus Minutes</span>
          </div>
        </div>
      </section>

      <details class="settings-accordion" title="Click to open settings">
        <summary>Settings</summary>
        <div class="settings-content">
          <div class="settings-row">
            <label for="volume-slider">Alarm Volume</label>
            <div class="volume-control">
              <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" title="Adjust volume">
              <button id="btn-test-sound" class="small-btn" title="Test alarm sound">Test</button>
            </div>
          </div>
          <div class="settings-row">
            <label class="toggle-label" title="Show desktop pop-ups when timer finishes">
              <input type="checkbox" id="toggle-notif">
              <span>Desktop Notifications</span>
            </label>
          </div>
          <div class="settings-row">
            <label class="toggle-label" title="Automatically start breaks when work finishes">
              <input type="checkbox" id="toggle-autostart">
              <span>Auto-start Breaks</span>
            </label>
          </div>
          <div class="settings-row">
            <label class="toggle-label" title="Automatically start work when break finishes">
              <input type="checkbox" id="toggle-autostart-work">
              <span>Auto-start Pomodoros</span>
            </label>
          </div>
        </div>
      </details>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
